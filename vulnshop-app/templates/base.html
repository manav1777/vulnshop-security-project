<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}VulnShop{% endblock %}
    </title>

    <meta
        name="description"
        content="VulnShop - Educational web application security lab"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            VulnShop
        </a>

        <span class="brand-path">
            / learn &gt; break &gt; fix
        </span>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/"
                    >
                        Home
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/products"
                    >
                        Products
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/login"
                    >
                        Login
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main>

    <div class="container page-container">

        {% block content %}
        {% endblock %}

    </div>

</main>


<footer>

    <div class="container">

        <p>
            VulnShop / educational web security lab / authorized testing only
        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
